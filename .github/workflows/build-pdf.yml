name: Build Portfolio PDF

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build LaTeX (latexmk via latex-action)
        id: latex
        continue-on-error: true
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: latex
          root_file: main.tex
          # Force PDF mode and good error output
          args: -pdf -interaction=nonstopmode -file-line-error -halt-on-error -recorder

      - name: Print first LaTeX errors (console)
        if: always()
        run: |
          echo "==== First LaTeX errors (if any) ===="
          if [ -f latex/main.log ]; then
            grep -n "!" latex/main.log | head -n 120 || true
            echo
            echo "==== Common fatal hints ===="
            grep -n "Invalid UTF-8\|File ended while scanning\|Runaway argument\|Emergency stop\|LaTeX Error" latex/main.log | head -n 120 || true
          else
            echo "latex/main.log not found."
          fi

      - name: Upload LaTeX logs (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latex-logs
          path: |
            latex/main.log
            latex/main.fls
            latex/main.aux
            latex/main.out
            latex/main.toc
            latex/main.tex
            latex/preamble.tex
            latex/titlepage.tex
            latex/license.tex
            latex/sections/**/*
          if-no-files-found: warn

      - name: Copy PDF to repo root
        if: always()
        run: |
          if [ -f latex/main.pdf ]; then
            cp latex/main.pdf Algorithms-Portfolio.pdf
          else
            echo "latex/main.pdf not found (build likely failed)."
          fi

      - name: Commit PDF to repo (if changed)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ ! -f Algorithms-Portfolio.pdf ]; then
            echo "No PDF to commit."
            exit 0
          fi

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if git diff --quiet -- Algorithms-Portfolio.pdf; then
            echo "PDF unchanged — no commit needed."
            exit 0
          fi

          git add Algorithms-Portfolio.pdf
          git commit -m "Update portfolio PDF [skip ci]"
          git push

      - name: Fail workflow if PDF not produced
        run: |
          test -f latex/main.pdf
