name: Build Portfolio PDF

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build with a deterministic latexmk -pdf pipeline
      - name: Build PDF (latexmk -pdf)
        id: build_pdf
        continue-on-error: true
        run: |
          set -euxo pipefail
          cd latex
          # Clean old aux files (optional but reduces weirdness)
          latexmk -C || true
          # Force PDF mode, verbose errors
          latexmk -pdf -interaction=nonstopmode -file-line-error -halt-on-error -recorder main.tex

      # Print useful error context into the Actions console
      - name: Print first LaTeX errors
        if: always()
        run: |
          echo "==== First LaTeX errors (if any) ===="
          if [ -f latex/main.log ]; then
            grep -n "!" latex/main.log | head -n 120 || true
            echo
            echo "==== Common fatal hints ===="
            grep -n "Invalid UTF-8\|File ended while scanning\|Runaway argument\|Emergency stop\|LaTeX Error" latex/main.log | head -n 120 || true
          else
            echo "latex/main.log not found."
          fi

      # Always upload logs for debugging
      - name: Upload LaTeX logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latex-logs
          path: |
            latex/main.log
            latex/main.fls
            latex/main.aux
            latex/main.out
            latex/main.toc
            latex/main.tex
            latex/preamble.tex
            latex/titlepage.tex
            latex/license.tex
            latex/sections/**/*
          if-no-files-found: warn

      # Copy the built PDF (if it exists) to repo root
      - name: Copy PDF to repo root
        if: always()
        run: |
          if [ -f latex/main.pdf ]; then
            cp latex/main.pdf Algorithms-Portfolio.pdf
            echo "PDF copied to Algorithms-Portfolio.pdf"
          else
            echo "latex/main.pdf not found (build likely failed)."
          fi

      # Commit PDF only on pushes to main (NOT on PRs)
      - name: Commit PDF to repo (if changed)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ ! -f Algorithms-Portfolio.pdf ]; then
            echo "No PDF to commit."
            exit 0
          fi

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # If unchanged, skip commit
          if git diff --quiet -- Algorithms-Portfolio.pdf; then
            echo "PDF unchanged — no commit needed."
            exit 0
          fi

          git add Algorithms-Portfolio.pdf
          git commit -m "Update portfolio PDF [skip ci]"
          git push

      # Make the workflow fail if the PDF wasn't produced
      - name: Fail if PDF not produced
        run: |
          test -f latex/main.pdf
